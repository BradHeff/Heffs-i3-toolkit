[package]
name = "vigil-i3-toolkit"
version = "0.2.0"
description = "Visual config toolkit for the VigilOS i3wm build"
authors = ["Brad Heffernan"]
edition = "2021"

[lib]
name = "vigil_i3_toolkit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
chrono = "0.4"
